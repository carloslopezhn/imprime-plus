name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install JS deps (solo @tauri-apps/cli; el frontend es estatico en src/)
        run: npm install

      - name: Clave de updater efimera (el .exe no depende de ella; no publicamos el .sig)
        shell: bash
        run: |
          npx --yes @tauri-apps/cli signer generate -w "$RUNNER_TEMP/u.key" -p ""
          echo "TAURI_SIGNING_PRIVATE_KEY=$(cat "$RUNNER_TEMP/u.key")" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"

      - name: Build (NSIS + MSI)
        run: npx tauri build

      - name: Subir instalador como artifact
        uses: actions/upload-artifact@v4
        with:
          name: imprime-plus-windows
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
